[project]
name = "tdd-ingest"
version = "0.1.0"
description = "Raw snapshot ingest for Texas Data Desk (Socrata, CKAN, CSV)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.28",
    "pyarrow>=18",
    "pydantic>=2.9",
    "pyyaml>=6",
    "typer>=0.15",
]

[project.scripts]
tdd-ingest = "tdd_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdd_ingest"]
