name: texas_data_desk
version: "0.1.0"
config-version: 2
profile: texas_data_desk

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target]

# Pass with --vars "$(uv run tdd-ingest dbt-vars <env>)": the environment name and one raw
# snapshot date per dataset (data/raw/<dataset_id>/<date>/), from data/snapshots.yaml.
vars:
  snapshot_env: "unset"
  snapshots: {}

on-run-start:
  - "{{ check_snapshot_env() }}"

models:
  texas_data_desk:
    staging:
      # Tables, not views: agents query these often and the raw Parquet is all text.
      +materialized: table
