[project]
name = "tdd-api"
version = "0.1.0"
description = "Texas Data Desk backend: model adapter, warehouse tools and agents"
requires-python = ">=3.12,<3.13"
# Vercel installs from this file, not the workspace uv.lock, so the runtime-critical packages
# are pinned to the versions the tests run on.
dependencies = [
    "duckdb==1.5.6",
    "fastapi==0.162.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6",
    "typer>=0.15",
]

[project.scripts]
tdd-model-check = "tdd_api.model_check.cli:app"

# Vercel: the FastAPI app is apps/api/app.py (project root directory: apps/api).
[tool.vercel]
entrypoint = "app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdd_api"]
