[project]
name = "tdd-api"
version = "0.1.0"
description = "Texas Data Desk backend: model adapter, warehouse tools and agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6",
    "tdd-ingest",
    "typer>=0.15",
]

[project.scripts]
tdd-model-check = "tdd_api.model_check.cli:app"

[tool.uv.sources]
tdd-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdd_api"]
