[project]
name = "texas-data-desk"
version = "0.1.0"
description = "Multi-agent Q&A over Texas city open data"
requires-python = ">=3.12,<3.13"
dependencies = ["tdd-api", "tdd-ingest"]

[dependency-groups]
dev = [
    "dbt-duckdb>=1.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "respx>=0.22",
    "uvicorn>=0.32",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "data/ingest"]

[tool.uv.sources]
tdd-api = { workspace = true }
tdd-ingest = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data/dbt/target", "data/raw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["apps/api/src", "apps/api/tests", "data/ingest/src", "data/ingest/tests", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["data/ingest/tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests", "data/ingest/tests"]
pythonpath = ["data/ingest/tests"]
addopts = "-m 'not live' --import-mode=importlib"
markers = ["live: hits real city portals (excluded by default and in CI)"]
